# Every pull request and push to main: the same checks a release runs, minus publishing. Third-party actions
# are pinned to a full commit, so a moved tag can't change what runs here, and the runner to ubuntu-24.04 (not
# ubuntu-latest, which moves to Ubuntu 26 on 19 October 2026), as release.yml's is.
name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bunx playwright-core install --with-deps chromium
      - run: bun run check
      # ShipBill's current release: the published specification and the embedded checkout's protocol.
      - run: bun run contract
